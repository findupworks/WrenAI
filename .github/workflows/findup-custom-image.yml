name: Build and Push WrenUI Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: wren-ui
  DOCKERFILE_PATH: wren-ui/Dockerfile
  DOCKER_HUB_REPO: findupdev  # Your Docker Hub namespace

jobs:
  build:
    name: Build Docker Image
    if: github.repository == 'findupworks/WrenAI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: wren-ui
          file: ${{ env.DOCKERFILE_PATH }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_HUB_REPO }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_HUB_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            YARN_ENABLE_IMMUTABLE_INSTALLS=false