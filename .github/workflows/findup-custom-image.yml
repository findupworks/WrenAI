name: Build and Push WrenUI Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: wren-ui
  DOCKERFILE_PATH: wren-ui/Dockerfile
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  setup-build:
    name: Setup and Build
    if: github.repository == 'findupworks/WrenAI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Prepare build environment
        run: |
          mkdir -p /tmp/.buildx-cache
          touch /tmp/.buildx-cache/index.json

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: wren-ui
          file: ${{ env.DOCKERFILE_PATH }}
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            YARN_ENABLE_IMMUTABLE_INSTALLS=false
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}

      - name: Verify build
        if: always()
        run: |
          echo "Build completed with status: ${{ job.status }}"
          docker images

  push-tags:
    needs: setup-build
    if: github.event_name == 'push' && github.repository == 'findupworks/WrenAI' && needs.setup-build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Push versioned images
        uses: docker/build-push-action@v5
        with:
          context: wren-ui
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max